# Add to the existing ar-docker/docker-compose.yml; preserve its original services.
services:
  studio:
    build:
      context: ./performer-service
      dockerfile: deploy/Dockerfile
    image: ar-performer:latest
    container_name: ar-performer
    env_file: ./performer-service/private.env
    environment:
      PERFORMER_HOST: 0.0.0.0
      PERFORMER_PORT: 8091
      PERFORMER_DATA_DIR: /data
      COOKIE_SECURE: "1"
    volumes:
      - ./performer-data:/data
    restart: unless-stopped
  ar:
    depends_on:
      - studio
