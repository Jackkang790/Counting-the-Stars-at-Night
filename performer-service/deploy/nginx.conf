server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /index.html { add_header Cache-Control "no-store, must-revalidate"; }
    # Public discovery only. Studio credentials and write APIs retain their policy.
    location ^~ /api/ar/v1/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control "no-cache" always;
        if ($request_method = OPTIONS) { return 204; }
        limit_except GET HEAD OPTIONS { deny all; }
        types { application/json json; text/javascript mjs; model/gltf-binary glb; }
        try_files $uri =404;
    }
    location ^~ /api/studio/ {
        client_max_body_size 380m;
        proxy_pass http://studio:8091;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        add_header Cache-Control "no-store" always;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.glb$ { default_type model/gltf-binary; try_files $uri =404; }
}
