# Original AR query links continue to open the AR application.
map "$arg_musical:$arg_studio:$arg_trackingLab" $legacy_ar {
    default 0;
    ~(^|:)1(:|$) 1;
}
server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 380m;

    location = / {
        if ($legacy_ar) { return 307 /ar/$is_args$args; }
        add_header Cache-Control "no-store, must-revalidate";
        try_files /index.html =404;
    }
    location = /index.html { add_header Cache-Control "no-store, must-revalidate"; }
    location = /ar { return 308 /ar/; }
    location = /ar/ { add_header Cache-Control "no-store, must-revalidate"; try_files /ar/index.html =404; }
    location = /ar/index.html { add_header Cache-Control "no-store, must-revalidate"; }

    location ^~ /api/v1/ {
        proxy_pass http://tour-api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location = /docs { proxy_pass http://tour-api:8000; proxy_set_header Host $http_host; }
    location = /openapi.json { proxy_pass http://tour-api:8000; proxy_set_header Host $http_host; }
    location ^~ /api/studio/ {
        proxy_pass http://studio:8091;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /api/ar/v1/ { rewrite ^/api/ar/v1/(.*)$ /ar/api/ar/v1/$1 last; }
    location ^~ /ar/api/ar/v1/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control "no-cache" always;
        if ($request_method = OPTIONS) { return 204; }
        limit_except GET HEAD OPTIONS { deny all; }
        types { application/json json; text/javascript mjs; model/gltf-binary glb; }
        try_files $uri =404;
    }
    location ^~ /api/ { return 404; }
    location ^~ /ar/ { try_files $uri $uri/ =404; }
    location / { try_files $uri $uri/ =404; }
}
