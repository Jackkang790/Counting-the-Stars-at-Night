# 컨테이너 내부 nginx: 정적 dist 서빙 + SPA 폴백 + .glb MIME.
# TLS 는 호스트 nginx(리버스 프록시)가 담당하므로 여기서는 평문 80 만 리슨한다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html 은 항상 최신 (빌드 ID 대조용)
    location = /index.html { add_header Cache-Control "no-store, must-revalidate"; }

    location / { try_files $uri $uri/ /index.html; }

    # glTF 바이너리 MIME (일부 뷰어/XR 로더가 요구)
    location ~* \.glb$ { default_type model/gltf-binary; try_files $uri =404; }
}
